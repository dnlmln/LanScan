services:
  lanscan:
    build: .
    container_name: ${CONTAINER_NAME:-lanscan}
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env.example
    cap_add:
      - NET_RAW
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./test:/app/test
    restart: unless-stopped
